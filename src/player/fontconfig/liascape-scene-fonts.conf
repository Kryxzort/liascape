<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Liascape's scene fonts: open stand-ins for the Windows families a Wallpaper Engine scene's text asks for
  (`systemfont_consolas` is Consolas …) that fontconfig's own configuration has no metric alias for.
  liascape-scene-worker compiles this file in and adds it to its own fontconfig configuration only
  (src/player/src/scene/fonts.rs ALIASES); no other app sees it.

  `accept` puts the stand-in right after the family asked for, the way fontconfig's 30-metric-aliases.conf
  does: an installed Consolas still wins, Cascadia Mono comes before any generic monospace.
  Arial / Times New Roman / Courier New → Liberation and Calibri / Cambria → Carlito / Caladea are already
  fontconfig's (30-metric-aliases.conf). Wine's Tahoma is named Tahoma itself: installed, it is matched
  directly and needs no alias.
-->
<fontconfig>
  <alias binding="same">
    <family>Consolas</family>
    <accept>
      <family>Cascadia Mono</family>
    </accept>
  </alias>
  <alias binding="same">
    <family>Segoe UI</family>
    <accept>
      <family>Selawik</family>
    </accept>
  </alias>
  <alias binding="same">
    <family>Comic Sans MS</family>
    <accept>
      <family>Comic Neue</family>
    </accept>
  </alias>
</fontconfig>
