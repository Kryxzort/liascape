[package]
name = "liascape-player"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "liascape-player — Wayland live-wallpaper compositor"

[features]
# The scene worker links LWE's core (`LIASCAPE_LWE_CORE_DIR`: the flake's `lwe-core` — devShell and
# package — or `scripts/lwe.sh build`). `--no-default-features` builds without it:
# `liascape-scene-worker` then runs `--stub` and the synthetic renderer only.
default = ["lwe"]
lwe = []

[[bin]]
name = "liascape-player"
path = "src/main.rs"

[[bin]]
name = "liascape-scene-worker"
path = "src/bin/liascape-scene-worker/main.rs"

[dependencies]
calloop = "0.14.5"
glow = "0.18.0"
khronos-egl = { version = "6.0.0", features = ["static"] }
libc = "0.2"
pipewire = { version = "0.10", features = ["v1_0_0"] }
png = "0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
wayland-egl = "0.32.11"
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[build-dependencies]
bindgen = "0.72"
pkg-config = "0.3"

# Debug builds keep line tables only (enough for backtraces with file:line) and dependencies no debug info at all: full
# debug info was most of each target/ (2–6 GB per git worktree, one per agent), and writing and later deleting that much
# on every checkout is slow. split-debuginfo keeps what is left out of the linked binaries, so links are faster too.
# Need a full debugger session? `CARGO_PROFILE_DEV_DEBUG=full cargo build`.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
