[package]
name = "lp-player"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "lp-player — Wayland live-wallpaper compositor"

[features]
# The scene worker links LWE's core (`scripts/lwe.sh build`, `LP_LWE_CORE_DIR`). OFF by default
# until the LWE build track lands (it flips this to `default = ["lwe"]`); without it
# `lp-scene-worker` runs `--stub` and the synthetic renderer only.
default = []
lwe = []

[[bin]]
name = "lp-player"
path = "src/main.rs"

[[bin]]
name = "lp-scene-worker"
path = "src/bin/lp-scene-worker/main.rs"

[dependencies]
calloop = "0.14.5"
glow = "0.18.0"
khronos-egl = { version = "6.0.0", features = ["static"] }
libc = "0.2"
pipewire = { version = "0.10", features = ["v1_0_0"] }
png = "0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
wayland-egl = "0.32.11"
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop"] }

[build-dependencies]
bindgen = "0.72"
pkg-config = "0.3"
