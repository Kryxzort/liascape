[package]
name = "lp-player"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "lp-player — Wayland live-wallpaper compositor"

[dependencies]
calloop = "0.14.5"
glow = "0.18.0"
khronos-egl = { version = "6.0.0", features = ["static"] }
libc = "0.2"
png = "0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
wayland-egl = "0.32.11"

[build-dependencies]
bindgen = "0.72"
pkg-config = "0.3"
